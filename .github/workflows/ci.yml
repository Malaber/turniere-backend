name: CI
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        target:
        - production
        - test
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: base_commit=${{ github.sha }}
        platforms: linux/amd64
        tags: registry.gitlab.com/turniere/turniere-backend/${{ matrix.target }}/commits:local
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        target: ${{ matrix.target }}
        outputs: type=docker,dest=/tmp/${{ matrix.target }}.tar
    - uses: actions/upload-artifact@v7
      with:
        name: image-${{ matrix.target }}
        path: /tmp/${{ matrix.target }}.tar
        retention-days: 7
        if-no-files-found: error
  checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
        - lint
        - shard-1
        - shard-2
        - shard-3
        - shard-4
        - shard-5
        - shard-6
        - shard-7
        - shard-8
        - http
        - load
        - follow
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: pip install invoke==2.2.0
    - uses: actions/download-artifact@v8
      with:
        pattern: image-*
        merge-multiple: true
        path: /tmp/images
    - run: |-
        docker load -i /tmp/images/production.tar
        docker load -i /tmp/images/test.tar
    - run: inv ci-check --check=${{ matrix.check }} --no-build
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.check }}
        path: e2e-artifacts/ci/
        retention-days: 30
  publish:
    needs:
    - checks
    - task-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURNIERE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: registry
    strategy:
      matrix:
        target:
        - production
        - test
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: registry.gitlab.com
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: base_commit=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        tags: |-
          registry.gitlab.com/turniere/turniere-backend/${{ matrix.target }}/commits:${{ github.sha }}
          registry.gitlab.com/turniere/turniere-backend/${{ matrix.target }}:latest
          registry.gitlab.com/turniere/turniere-backend/${{ matrix.target }}/refs:main
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        target: ${{ matrix.target }}
        push: true
  deploy-request:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURNIERE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: deployment-dispatch
    steps:
    - name: Request infra deployment
      env:
        GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        VERSION: ${{ github.sha }}
      run: gh api repos/Malaber/turniere-infra/dispatches --method POST -f event_type=image-published -f client_payload[target]=turniere-backend
        -f client_payload[version]="$VERSION"
  task-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install invoke==2.2.0
      - run: inv ci-task-tests
