name: CI
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        target:
        - production
        - test
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: base_commit=${{ github.sha }}
        platforms: linux/amd64
        tags: registry.gitlab.com/turniere/turniere-backend/${{ matrix.target }}/commits:local
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        target: ${{ matrix.target }}
        outputs: type=docker,dest=/tmp/${{ matrix.target }}.tar
    - uses: actions/upload-artifact@v7
      with:
        name: image-${{ matrix.target }}
        path: /tmp/${{ matrix.target }}.tar
        retention-days: 7
        if-no-files-found: error
  checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
        - lint
        - shard-1
        - shard-2
        - shard-3
        - shard-4
        - shard-5
        - shard-6
        - shard-7
        - shard-8
        - http
        - load
        - follow
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: pip install invoke==2.2.0
    - uses: actions/download-artifact@v8
      with:
        pattern: image-*
        merge-multiple: true
        path: /tmp/images
    - run: 'docker load -i /tmp/images/production.tar

        docker load -i /tmp/images/test.tar'
    - run: inv ci-check --check=${{ matrix.check }} --no-build
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.check }}
        path: e2e-artifacts/ci/
        retention-days: 30
  publish:
    needs:
    - checks
    - task-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - target: production
          image: ghcr.io/malaber/turniere-backend
        - target: test
          image: ghcr.io/malaber/turniere-backend-test
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: base_commit=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ matrix.image }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        target: ${{ matrix.target }}
        push: true
        labels: 'org.opencontainers.image.source=https://github.com/${{ github.repository }}

          org.opencontainers.image.revision=${{ github.sha }}'
    permissions:
      contents: read
      packages: write
  task-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: pip install invoke==2.2.0
    - run: inv ci-task-tests
  release:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: pip install invoke==2.2.0
    - run: inv release-github
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
