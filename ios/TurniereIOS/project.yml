name: TurniereApp
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: de
packages:
  TurniereCore:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: VWKG94374J
targets:
  Turniere:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [App, Assets.xcassets]
    dependencies:
      - package: TurniereCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: re.turnie
        PRODUCT_NAME: Turniere
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: turnie.re
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  TurniereUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources: [UITests]
    dependencies:
      - target: Turniere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: re.turnie.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Turniere:
    build:
      targets:
        Turniere: all
    test:
      targets: [TurniereUITests]
